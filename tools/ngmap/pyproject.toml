[project]
name = "ngmap"
version = "0.1.0"
description = "Offline analysis of real AS350B3 recordings for the AS350B3_SOUNDSYS module"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
# Only for eyeballing tracks and spectrograms; nothing in the pipeline needs it.
plots = ["matplotlib>=3.7"]

[project.scripts]
ngmap = "ngmap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ngmap"]
