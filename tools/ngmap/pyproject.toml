[project]
name = "ngmap"
version = "0.1.0"
description = "Offline analysis of real AS350B3 recordings for the AS350B3_SOUNDSYS module"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[project.scripts]
ngmap = "ngmap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
